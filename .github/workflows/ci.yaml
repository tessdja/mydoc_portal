name: Run Unit Tests

on:
  push:
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # runtime/test deps just in case
          pip install "fastapi[all]" uvicorn pytest pytest-cov httpx

      - name: Run unit tests
        run: pytest -q --maxfail=1 --disable-warnings -r fE

  llm-evals:
    needs: unit-tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install eval deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          # Ensure DeepEval + test clients are present
          pip install deepeval "fastapi[all]" pytest httpx

      - name: Check OPENAI_API_KEY is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY secret missing" && exit 1)

      # Run with STRICT_EVALS=1 to include the Summarization metric.
      # If you prefer to keep it off in CI, change to STRICT_EVALS=0.
      - name: Run DeepEval tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRICT_EVALS: "1"
        run: pytest -q tests/evals
